# ═════════════════════════ Render.com Blueprint ═════════════════════════
# Khai báo BE service tự deploy mỗi khi push main branch.
# Cách dùng: ở dashboard Render → "New Blueprint" → connect GitHub repo →
# Render đọc file này → tạo service.
#
# Set env vars TRỰC TIẾP trong Render dashboard SAU khi tạo service (đừng
# commit secret vào file này):
#   - ConnectionStrings__EduTrackDbContextConnection
#   - Jwt__Key
#   - Cors__AllowedOrigins
# ══════════════════════════════════════════════════════════════════════
services:
  # ─── BE: .NET 8 API (Docker) ───
  - type: web
    name: edutrack-api
    runtime: docker
    region: singapore                # gần VPS VN nhất → giảm latency mỗi query EF
    dockerfilePath: ./EduTrack.API/Dockerfile
    dockerContext: .
    plan: free                       # 750h/month, sleeps 15min idle
    healthCheckPath: /health
    autoDeploy: true                 # tự redeploy mỗi push develop branch
    branch: develop
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: https://edutrack.app
      - key: Jwt__Audience
        value: edutrack.app
      # Sensitive vars — set ở dashboard và đánh dấu "secret":
      #   - ConnectionStrings__EduTrackDbContextConnection
      #   - Jwt__Key
      #   - Cors__AllowedOrigins  (= URL static site bên dưới, vd https://edutrack-web.onrender.com)
      #   - SMTP (Smtp__Enabled, Smtp__User, Smtp__Password, Smtp__FromAddress)

  # ─── FE: Angular static site (build bằng Node, serve tĩnh — free) ───
  - type: web
    name: edutrack-web
    runtime: static
    rootDir: EduTrack.WEB
    buildCommand: npm install --legacy-peer-deps && npm run build:prod
    staticPublishPath: dist/edutrack.web-prod/browser
    autoDeploy: true
    branch: develop
    # SPA deep-link: mọi route chưa khớp file tĩnh → trả index.html (Angular router lo phần còn lại)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

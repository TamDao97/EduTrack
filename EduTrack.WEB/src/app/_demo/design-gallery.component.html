<div class="gallery">
  <header class="gallery__header">
    <span class="gallery__eyebrow">EDUTRACK · DESIGN GALLERY</span>
    <h1 class="gallery__title">Demo các màn hình</h1>
    <p class="gallery__sub">
      Mock data only — chưa kết nối API. Mục đích: thấy UI + flow trước khi build thật.
    </p>
  </header>

  <ul class="gallery__grid">
    <li *ngFor="let item of items"
        class="demo-card"
        [class.is-clickable]="item.status === 'ready'"
        [class.is-planned]="item.status === 'planned'"
        (click)="open(item)">
      <div class="demo-card__art" [style.background]="item.gradient">
        <span nz-icon [nzType]="item.iconType" nzTheme="outline"></span>
      </div>
      <div class="demo-card__body">
        <div class="demo-card__head">
          <h3 class="demo-card__title">{{ item.title }}</h3>
          <span class="demo-card__status" [attr.data-status]="item.status">
            {{ statusLabel(item.status) }}
          </span>
        </div>
        <p class="demo-card__desc">{{ item.desc }}</p>
      </div>
      <span class="demo-card__arrow" *ngIf="item.status === 'ready'" nz-icon nzType="arrow-right"></span>
    </li>
  </ul>
</div>

<div class="ad">
  <section class="ad__panel">
    <div class="row">
      <div class="col-md-6 mb-3 mb-md-0">
        <nz-card nzTitle="Cây menu">
          <nz-tree [nzData]="pageTreeData" [nzDraggable]="true" [nzBlockNode]="true" [nzShowLine]="true"
            (nzClick)="onNodeClick($event)" (nzOnDragDrop)="onDrop($event)">
          </nz-tree>
        </nz-card>
      </div>
      <div class="col-md-6">
        <nz-card nzTitle="Chi tiết trang">
          <form nz-form [formGroup]="frmGroup">
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="idParent">Trang cha</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <nz-tree-select [nzNodes]="pageTreeData" nzShowSearch nzPlaceHolder="Trang cha"
                  formControlName="idParent"></nz-tree-select>
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Tên trang</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Vui lòng nhập thông tin!">
                <input nz-input formControlName="name" />
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="url">Url</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <input nz-input formControlName="url" />
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="icon">Icon</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <input nz-input formControlName="icon" />
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="permissionCode">Key code</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <input nz-input formControlName="permissionCode" />
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="order">Thứ tự</nz-form-label>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <nz-input-number formControlName="order" [nzMin]="1" [nzMax]="10" />
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-control [nzOffset]="6" [nzSm]="14" [nzXs]="24">
                <div class="row">
                  <div class="col-12 col-md-6 mb-2">
                    <label nz-checkbox formControlName="isActive"></label> Sử
                    dụng
                  </div>
                  <div class="col-12 col-md-6 mb-2">
                    <label nz-checkbox formControlName="isTab"></label> Tab menu
                  </div>
                  <div class="col-12 col-md-6 mb-2">
                    <label nz-checkbox formControlName="isHomePage"></label>
                    Trang chủ
                  </div>
                </div>
              </nz-form-control>
            </nz-form-item>
          </form>
          <div class="row">
            <div class="col-md-12 col-lg-12 d-flex justify-content-end">
              <button nz-button [nzType]="'default'" (click)="onReset()">
                Làm mới
              </button>
              <button class="ms-2" nz-button [nzType]="'primary'" (click)="onSave()">
                Lưu
              </button>
              <button *ngIf="this.frmGroup.get('id')?.valid" class="ms-2" nz-button [nzType]="'primary'" nzDanger
                (click)="onDelete(this.frmGroup.get('id')?.value)">
                Xóa
              </button>
            </div>
          </div>
        </nz-card>
      </div>
    </div>
  </section>
</div>

<form nz-form [formGroup]="frmGroup" class="session-edit" nzLayout="vertical">
  <div class="session-edit__info">
    <span nz-icon nzType="team"></span>
    Đổi lịch áp dụng cho <strong>{{ params?.scheduledCount }} buổi chưa dạy</strong> của ca
    <strong>{{ params?.className || 'nhóm' }}</strong> — buổi đã dạy/đã huỷ giữ nguyên,
    nhắc phụ huynh tự cập nhật theo giờ mới.
  </div>

  <nz-form-item>
    <nz-form-label nzRequired>Ngày dạy</nz-form-label>
    <nz-form-control>
      <nz-date-picker formControlName="scheduledDate" nzFormat="EEEE, dd/MM/yyyy" class="full-w"></nz-date-picker>
    </nz-form-control>
  </nz-form-item>

  <div nz-row [nzGutter]="12">
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired>Bắt đầu</nz-form-label>
        <nz-form-control>
          <nz-time-picker formControlName="startTime" nzFormat="HH:mm" [nzMinuteStep]="15" class="full-w"></nz-time-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired>Kết thúc</nz-form-label>
        <nz-form-control>
          <nz-time-picker formControlName="endTime" nzFormat="HH:mm" [nzMinuteStep]="15" class="full-w"></nz-time-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <nz-form-item>
    <nz-form-label>Địa điểm</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="location" placeholder="Nhà cô · Trung tâm · Online…" />
    </nz-form-control>
  </nz-form-item>

  <div class="session-edit__actions">
    <button type="button" nz-button nzSize="large" (click)="onCancel()" [disabled]="isSubmitting">Huỷ</button>
    <button type="button" nz-button nzType="primary" nzSize="large" (click)="onSave()" [nzLoading]="isSubmitting">
      Đổi lịch cả ca
    </button>
  </div>
</form>
